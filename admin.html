<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elite Gadgets | Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #111;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,.25);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .primary-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ffd400;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #e8c000;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            color: #d00;
        }

        /* =========================
           DASHBOARD
        ========================= */

        #dashboard {
            display: none;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        .logout-btn {
            background: white;
            color: #111;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox-row label {
            display: flex;
            gap: 7px;
            align-items: center;
            margin: 0;
        }

        .checkbox-row input {
            width: auto;
        }

        /* =========================
           IMAGE UPLOAD
        ========================= */

        .upload-box {
            border: 2px dashed #bbb;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
        }

        .upload-box p {
            color: #666;
            margin-bottom: 15px;
        }

        #productImages {
            padding: 10px;
            background: white;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .preview-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        .preview-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            border-radius: 7px;
            background: #f4f4f4;
        }

        .preview-card p {
            font-size: 12px;
            margin-top: 8px;
            word-break: break-word;
            color: #555;
        }

        .existing-images {
            margin-top: 20px;
        }

        .existing-images h3 {
            margin-bottom: 12px;
        }

        .existing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .existing-grid img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f4f4f4;
        }

        .upload-status {
            margin-top: 15px;
            font-weight: bold;
        }

        /* =========================
           BUTTONS
        ========================= */

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save-btn {
            background: #ffd400;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-btn {
            background: #ddd;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background: white;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .product-card h3 {
            margin-bottom: 7px;
        }

        .product-card p {
            color: #666;
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
            background: #eee;
        }

        .badge.featured {
            background: #ffd400;
        }

        .badge.inactive {
            background: #ffdddd;
            color: #900;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #111;
            color: white;
        }

        .delete-btn {
            background: #e53935;
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .container {
                padding: 20px 12px;
            }

            .section {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .image-preview,
            .existing-grid,
            .products-list {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<div id="loginScreen">

    <div class="login-box">

        <h1>Elite Gadgets</h1>

        <p>Admin Dashboard</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">

    <header>

        <h1>Elite Gadgets — Admin</h1>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </header>


    <main class="container">


        <!-- =================================================
             ADD / EDIT PRODUCT
        ================================================= -->

        <section class="section">

            <h2 id="formTitle">
                Add New Product
            </h2>


            <form id="productForm">

                <div class="form-grid">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="e.g. iPhone 17 Pro"
                            required
                        >

                    </div>


                    <!-- BRAND -->

                    <div class="form-group">

                        <label for="productBrand">
                            Brand
                        </label>

                        <input
                            type="text"
                            id="productBrand"
                            placeholder="e.g. Apple"
                            required
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="productCategory">
                            Category
                        </label>

                        <select
                            id="productCategory"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Phones">
                                Phones
                            </option>

                            <option value="Audio">
                                Audio
                            </option>

                            <option value="Gaming">
                                Gaming
                            </option>

                            <option value="Accessories">
                                Accessories
                            </option>

                        </select>

                    </div>


                    <!-- SLUG -->

                    <div class="form-group">

                        <label for="productSlug">
                            Slug
                        </label>

                        <input
                            type="text"
                            id="productSlug"
                            placeholder="iphone-17-pro"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="productDescription">
                            Short Description
                        </label>

                        <textarea
                            id="productDescription"
                            placeholder="Short description..."
                        ></textarea>

                    </div>


                    <!-- ABOUT -->

                    <div class="form-group full">

                        <label for="productAbout">
                            About This Product
                        </label>

                        <textarea
                            id="productAbout"
                            placeholder="Tell customers about this device..."
                        ></textarea>

                    </div>


                    <!-- CAMERA -->

                    <div class="form-group">

                        <label for="productCamera">
                            Camera
                        </label>

                        <textarea
                            id="productCamera"
                            placeholder="Camera details..."
                        ></textarea>

                    </div>


                    <!-- DURABILITY -->

                    <div class="form-group">

                        <label for="productDurability">
                            Durability
                        </label>

                        <textarea
                            id="productDurability"
                            placeholder="Durability / protection..."
                        ></textarea>

                    </div>


                    <!-- STORAGE -->

                    <div class="form-group">

                        <label for="productStorage">
                            Storage
                        </label>

                        <input
                            type="text"
                            id="productStorage"
                            placeholder="256GB / 512GB / 1TB"
                        >

                    </div>


                    <!-- BATTERY -->

                    <div class="form-group">

                        <label for="productBattery">
                            Battery
                        </label>

                        <input
                            type="text"
                            id="productBattery"
                            placeholder="Battery details..."
                        >

                    </div>


                    <!-- FEATURES -->

                    <div class="form-group full">

                        <label for="productFeatures">
                            Important Features
                        </label>

                        <textarea
                            id="productFeatures"
                            placeholder="Important features..."
                        ></textarea>

                    </div>


                    <!-- SORT ORDER -->

                    <div class="form-group">

                        <label for="productSortOrder">
                            Sort Order
                        </label>

                        <input
                            type="number"
                            id="productSortOrder"
                            value="0"
                        >

                    </div>


                    <!-- =================================================
                         IMAGE UPLOAD
                    ================================================= -->

                    <div class="form-group full">

                        <label>
                            Product Images
                        </label>

                        <div class="upload-box">

                            <p>
                                Select up to 3 images directly from your device.
                            </p>

                            <input
                                type="file"
                                id="productImages"
                                accept="image/jpeg,image/jpg,image/png,image/webp"
                                multiple
                            >

                            <div
                                id="imagePreview"
                                class="image-preview"
                            ></div>

                        </div>


                        <div
                            id="existingImages"
                            class="existing-images"
                            style="display:none;"
                        >

                            <h3>
                                Current Images
                            </h3>

                            <div
                                id="existingImageGrid"
                                class="existing-grid"
                            ></div>

                        </div>


                        <div
                            id="uploadStatus"
                            class="upload-status"
                        ></div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="form-group full">

                        <div class="checkbox-row">

                            <label>

                                <input
                                    type="checkbox"
                                    id="productFeatured"
                                >

                                Featured Product

                            </label>


                            <label>

                                <input
                                    type="checkbox"
                                    id="productActive"
                                    checked
                                >

                                Active Product

                            </label>

                        </div>

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveProductBtn"
                    >
                        Save Product
                    </button>


                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelEditBtn"
                        style="display:none;"
                    >
                        Cancel Edit
                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             PRODUCTS LIST
        ================================================= -->

        <section class="section">

            <h2>
                Products
            </h2>

            <div
                id="productsList"
                class="products-list"
            >
                Loading products...
            </div>

        </section>

    </main>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://qimgbjtotjmhsczhfylu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JTNZLbqNhUk6PQ14D6hQzg_TUgWYbkm";

const STORAGE_BUCKET =
    "product-images";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let editingProductId = null;

let existingImageUrls = [];


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");

const productForm =
    document.getElementById("productForm");

const productImages =
    document.getElementById("productImages");

const imagePreview =
    document.getElementById("imagePreview");

const existingImages =
    document.getElementById("existingImages");

const existingImageGrid =
    document.getElementById("existingImageGrid");

const uploadStatus =
    document.getElementById("uploadStatus");

const productsList =
    document.getElementById("productsList");

const formTitle =
    document.getElementById("formTitle");

const saveProductBtn =
    document.getElementById("saveProductBtn");

const cancelEditBtn =
    document.getElementById("cancelEditBtn");


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginMessage.textContent =
            "Logging in...";


        const {
            data,
            error
        } = await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            loginMessage.textContent =
                error.message;

            return;

        }


        /* LOGIN SUCCESS */

        loginMessage.textContent = "";

        loginScreen.style.display = "none";

        dashboard.style.display = "block";

        await loadProducts();

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        dashboard.style.display =
            "none";

        loginScreen.style.display =
            "flex";

        loginForm.reset();

    }
);


/* =========================================================
   IMAGE PREVIEW
========================================================= */

productImages.addEventListener(
    "change",
    function() {

        imagePreview.innerHTML = "";

        uploadStatus.textContent = "";


        const files =
            Array.from(
                productImages.files
            );


        if (files.length > 3) {

            alert(
                "Please select a maximum of 3 images."
            );

            productImages.value = "";

            return;

        }


        for (const file of files) {


            const allowedTypes = [

                "image/jpeg",

                "image/jpg",

                "image/png",

                "image/webp"

            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                alert(
                    file.name +
                    " is not a supported image type."
                );

                productImages.value = "";

                imagePreview.innerHTML = "";

                return;

            }


            /* 5MB MAX */

            if (
                file.size >
                5 * 1024 * 1024
            ) {

                alert(
                    file.name +
                    " is larger than 5MB."
                );

                productImages.value = "";

                imagePreview.innerHTML = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "preview-card";


                    card.innerHTML = `

                        <img
                            src="${e.target.result}"
                            alt="Preview"
                        >

                        <p>
                            ${escapeHtml(file.name)}
                        </p>

                    `;


                    imagePreview.appendChild(
                        card
                    );

                };


            reader.readAsDataURL(file);

        }

    }
);


/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage(
    file,
    slug,
    number
) {


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const safeSlug =
        slug

            .toLowerCase()

            .trim()

            .replace(
                /[^a-z0-9]+/g,
                "-"
            )

            .replace(
                /^-+|-+$/g,
                ""
            );


    const fileName =
        `${safeSlug}-${number}-${Date.now()}.${extension}`;


    const filePath =
        `products/${fileName}`;


    const {
        error
    } = await supabaseClient.storage

        .from(STORAGE_BUCKET)

        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );


    if (error) {

        throw error;

    }


    const {
        data
    } =
        supabaseClient.storage

            .from(STORAGE_BUCKET)

            .getPublicUrl(filePath);


    return data.publicUrl;

}


/* =========================================================
   GET STORAGE PATH
========================================================= */

function getStoragePath(url) {

    if (!url) {

        return null;

    }


    const marker =
        `/storage/v1/object/public/${STORAGE_BUCKET}/`;


    const index =
        url.indexOf(marker);


    if (index === -1) {

        return null;

    }


    return decodeURIComponent(
        url.substring(
            index + marker.length
        )
    );

}


/* =========================================================
   DELETE STORAGE IMAGES
========================================================= */

async function deleteStorageImages(
    urls
) {

    const paths =
        urls

            .map(
                getStoragePath
            )

            .filter(Boolean);


    if (!paths.length) {

        return;

    }


    const {
        error
    } = await supabaseClient.storage

        .from(STORAGE_BUCKET)

        .remove(paths);


    if (error) {

        console.warn(
            "Storage image deletion failed:",
            error
        );

    }

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveProductBtn.disabled =
            true;

        saveProductBtn.textContent =
            "Saving...";


        try {


            const name =
                document
                    .getElementById("productName")
                    .value
                    .trim();


            const brand =
                document
                    .getElementById("productBrand")
                    .value
                    .trim();


            const category =
                document
                    .getElementById("productCategory")
                    .value;


            const slug =
                document
                    .getElementById("productSlug")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("productDescription")
                    .value
                    .trim();


            const about =
                document
                    .getElementById("productAbout")
                    .value
                    .trim();


            const camera =
                document
                    .getElementById("productCamera")
                    .value
                    .trim();


            const durability =
                document
                    .getElementById("productDurability")
                    .value
                    .trim();


            const storage =
                document
                    .getElementById("productStorage")
                    .value
                    .trim();


            const battery =
                document
                    .getElementById("productBattery")
                    .value
                    .trim();


            const features =
                document
                    .getElementById("productFeatures")
                    .value
                    .trim();


            const sortOrder =
                parseInt(
                    document
                        .getElementById(
                            "productSortOrder"
                        )
                        .value
                ) || 0;


            const featured =
                document
                    .getElementById(
                        "productFeatured"
                    )
                    .checked;


            const active =
                document
                    .getElementById(
                        "productActive"
                    )
                    .checked;


            const files =
                Array.from(
                    productImages.files
                );


            let imageUrls =
                [...existingImageUrls];


            /* =============================================
               UPLOAD NEW IMAGES
            ============================================= */

            if (files.length > 0) {

                uploadStatus.textContent =
                    "Uploading images...";


                const newImages = [];


                for (
                    let i = 0;
                    i < files.length;
                    i++
                ) {

                    uploadStatus.textContent =
                        `Uploading image ${i + 1} of ${files.length}...`;


                    const url =
                        await uploadImage(
                            files[i],
                            slug,
                            i + 1
                        );


                    newImages.push(url);

                }


                imageUrls =
                    newImages;


                uploadStatus.textContent =
                    "Images uploaded successfully.";

            }


            /* =============================================
               PRODUCT DATA
            ============================================= */

            const productData = {

                name: name,

                brand: brand,

                category: category,

                slug: slug,

                description: description,

                about: about,

                camera: camera,

                durability: durability,

                storage: storage,

                battery: battery,

                features: features,

                image1:
                    imageUrls[0] || null,

                image2:
                    imageUrls[1] || null,

                image3:
                    imageUrls[2] || null,

                featured: featured,

                active: active,

                sort_order: sortOrder

            };


            let result;


            /* =============================================
               UPDATE
            ============================================= */

            if (editingProductId) {

                result =
                    await supabaseClient

                        .from("products")

                        .update(
                            productData
                        )

                        .eq(
                            "id",
                            editingProductId
                        );

            }


            /* =============================================
               INSERT
            ============================================= */

            else {

                result =
                    await supabaseClient

                        .from("products")

                        .insert(
                            productData
                        );

            }


            if (result.error) {

                throw result.error;

            }


            /* DELETE OLD IMAGES
               ONLY AFTER SUCCESSFUL UPDATE */

            if (
                editingProductId &&
                files.length > 0 &&
                existingImageUrls.length > 0
            ) {

                await deleteStorageImages(
                    existingImageUrls
                );

            }


            alert(
                editingProductId
                    ? "Product updated successfully!"
                    : "Product added successfully!"
            );


            resetForm();

            await loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                "Error: " +
                error.message
            );


            uploadStatus.textContent =
                "";

        }


        saveProductBtn.disabled =
            false;

        saveProductBtn.textContent =
            "Save Product";

    }
);


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {


    productsList.innerHTML =
        "Loading products...";


    const {
        data,
        error
    } = await supabaseClient

        .from("products")

        .select("*")

        .order(
            "sort_order",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        productsList.innerHTML =
            `
                <p>
                    Could not load products.
                    ${escapeHtml(error.message)}
                </p>
            `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        productsList.innerHTML =
            `
                <p>
                    No products yet.
                </p>
            `;

        return;

    }


    productsList.innerHTML =
        "";


    data.forEach(
        product => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            const image =
                product.image1 ||
                product.image2 ||
                product.image3;


            card.innerHTML = `

                ${
                    image
                        ? `
                            <img
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(product.name)}"
                            >
                          `
                        : `
                            <div
                                style="
                                    height:180px;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    background:#f5f5f5;
                                    border-radius:8px;
                                    margin-bottom:12px;
                                "
                            >
                                No Image
                            </div>
                          `
                }


                <h3>
                    ${escapeHtml(product.name)}
                </h3>


                <p>
                    <strong>Brand:</strong>
                    ${escapeHtml(product.brand || "")}
                </p>


                <p>
                    <strong>Category:</strong>
                    ${escapeHtml(product.category || "")}
                </p>


                <p>
                    <strong>Slug:</strong>
                    ${escapeHtml(product.slug || "")}
                </p>


                ${
                    product.featured
                        ? `
                            <span class="badge featured">
                                Featured
                            </span>
                          `
                        : ""
                }


                ${
                    product.active
                        ? `
                            <span class="badge">
                                Active
                            </span>
                          `
                        : `
                            <span class="badge inactive">
                                Inactive
                            </span>
                          `
                }


                <div class="product-actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct('${product.id}')"
                    >
                        Edit
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteProduct('${product.id}')"
                    >
                        Delete
                    </button>

                </div>

            `;


            productsList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

window.editProduct =
    async function(id) {


        const {
            data,
            error
        } = await supabaseClient

            .from("products")

            .select("*")

            .eq("id", id)

            .single();


        if (error) {

            alert(
                error.message
            );

            return;

        }


        editingProductId =
            id;


        existingImageUrls =

                data.image1,
                data.image2,
                data.image3

        document
            .getElementById("productName")
            .value =
            data.name || "";


        document
            .getElementById("productBrand")
            .value =
            data.brand || "";


        document
            .getElementById("productCategory")
            .value =
            data.category || "";


        document
            .getElementById("productSlug")
            .value =
            data.slug || "";


        document
            .getElementById("productDescription")
            .value =
            data.description || "";


        document
            .getElementById("productAbout")
            .value =
            data.about || "";


        document
            .getElementById("productCamera")
            .value =
            data.camera || "";


        document
            .getElementById("productDurability")
            .value =
            data.durability || "";


        document
            .getElementById("productStorage")
            .value =
            data.storage || "";


        document
            .getElementById("productBattery")
            .value =
            data.battery || "";


        document
            .getElementById("productFeatures")
            .value =
            data.features || "";


        document
            .getElementById("productSortOrder")

        document
            .getElementById("productFeatured")

        productImages.value =

        imagePreview.innerHTML =

        showExistingImages();


        formTitle.textContent =

        saveProductBtn.textContent =

        cancelEditBtn.style.display =
            "block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    };


/* =========================================================
   SHOW EXISTING IMAGES
========================================================= */

function showExistingImages() {


    if (
        !existingImageUrls.length
    ) {

        existingImages.style.display =
            "none";

        return;

    }


    existingImages.style.display =
        "block";


    existingImageGrid.innerHTML =
        "";


    existingImageUrls.forEach(
        url => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                url;


            img.alt =
                "Current product image";


            existingImageGrid.appendChild(
                img
            );

        }
    );

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

window.deleteProduct =
    async function(id) {


        const confirmed =
            confirm(
                "Are you sure you want to delete this product?"
            );


        if (!confirmed) {

            return;

        }


        try {


            const {
                data: product,
                error: fetchError
            } = await supabaseClient

                .from("products")

                .select("*")

                .eq("id", id)

                .single();


            if (fetchError) {

                throw fetchError;

            }


            const imageUrls =
                [
                    product.image1,
                    product.image2,
                    product.image3
                ].filter(Boolean);


            const {
                error
            } = await supabaseClient

                .from("products")

                .delete()

                .eq("id", id);


            if (error) {

                throw error;

            }


            await deleteStorageImages(
                imageUrls
            );


            alert(
                "Product deleted successfully."
            );


            await loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                "Error deleting product: " +
                error.message
            );

        }

    };


/* =========================================================
   CANCEL EDIT
========================================================= */

cancelEditBtn.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {


    productForm.reset();


    document
        .getElementById("productActive")
        .checked = true;


    editingProductId =
        null;


    existingImageUrls =
        [];


    imagePreview.innerHTML =
        "";


    existingImageGrid.innerHTML =
        "";


    existingImages.style.display =
        "none";


    uploadStatus.textContent =
        "";


    formTitle.textContent =
        "Add New Product";


    saveProductBtn.textContent =
        "Save Product";


    cancelEditBtn.style.display =
        "none";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   AUTO SLUG
========================================================= */

document
    .getElementById("productName")
    .addEventListener(
        "input",
        function() {

            if (editingProductId) {

                return;

            }


            const slug =
                this.value

                    .toLowerCase()

                    .trim()

                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )

                    .replace(
                        /^-+|-+$/g,
                        ""
                    );


            document
                .getElementById(
                    "productSlug"
                )
                .value =
                slug;

        }
    );


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

async function checkSession() {


    const {
        data
    } =
        await supabaseClient.auth
            .getSession();


    if (
        data.session
    ) {

        loginScreen.style.display =
            "none";

        dashboard.style.display =
            "block";

        await loadProducts();

    }

}


checkSession();
